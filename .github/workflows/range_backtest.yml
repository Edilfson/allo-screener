name: Range Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tarama modu"
        type: choice
        options: ["top30", "top50", "liste", "tek"]
        default: "top30"
      symbols:
        description: "mode=liste ise: BTCUSDT,ETHUSDT,SOLUSDT"
        default: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT"
      symbol:
        description: "mode=tek ise sembol"
        default: "BTCUSDT"
      tf:
        description: "Zaman dilimi"
        type: choice
        options: ["1h", "2h", "4h", "12h", "1d"]
        default: "4h"
      days:
        description: "Kac gunluk veri"
        default: "730"
      side:
        description: "Yon"
        type: choice
        options: ["both", "short", "long"]
        default: "both"
      max_conf_cost:
        description: "R7 teyit maliyeti tavani (0.25=1:3, 0.33=1:2, 1.0=kapali)"
        default: "0.25"
      min_rr:
        description: "Minimum R:R"
        default: "3.0"

permissions:
  contents: write

jobs:
  range-backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install requests pandas numpy

      - name: Backtest calistir
        run: |
          M="${{ github.event.inputs.mode }}"
          OUT="results/range_${{ github.event.inputs.tf }}_${{ github.event.inputs.mode }}.json"
          COMMON="--tf ${{ github.event.inputs.tf }} --days ${{ github.event.inputs.days }} --side ${{ github.event.inputs.side }} --max-conf-cost ${{ github.event.inputs.max_conf_cost }} --min-rr ${{ github.event.inputs.min_rr }} --oos --save-json $OUT"
          if [ "$M" = "top30" ]; then
            python backtest_range.py --top 30 $COMMON
          elif [ "$M" = "top50" ]; then
            python backtest_range.py --top 50 $COMMON
          elif [ "$M" = "liste" ]; then
            python backtest_range.py --symbols "${{ github.event.inputs.symbols }}" $COMMON
          else
            python backtest_range.py --symbol "${{ github.event.inputs.symbol }}" $COMMON
          fi

      - name: Sonuclari repoya kaydet
        continue-on-error: true
        run: |
          git config user.name "allo-screener-bot"
          git config user.email "actions@github.com"
          git add results/*.json
          git diff --quiet --cached || git commit -m "range backtest sonuc [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: range-results
          path: results/*.json
