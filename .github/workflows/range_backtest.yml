name: Range Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tarama modu"
        type: choice
        options: ["top100_multi_tf", "top100", "top50", "top30", "liste", "tek"]
        default: "top100_multi_tf"
      tfs:
        description: "multi_tf modunda dilimler"
        default: "1h,2h,4h"
      symbols:
        description: "mode=liste ise"
        default: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT"
      symbol:
        description: "mode=tek ise"
        default: "BTCUSDT"
      tf:
        description: "tek dilim modlarinda"
        type: choice
        options: ["1h", "2h", "4h", "12h", "1d"]
        default: "4h"
      days:
        description: "Kac gunluk veri"
        default: "730"
      side:
        description: "Yon"
        type: choice
        options: ["both", "long", "short"]
        default: "both"
      max_conf_cost:
        description: "R7 tavani (0.25=1:3, 0.33=1:2, 1.0=kapali)"
        default: "0.25"
      min_rr:
        description: "Minimum R:R"
        default: "3.0"

permissions:
  contents: write

jobs:
  range-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install requests pandas numpy

      - name: Backtest calistir
        run: |
          M="${{ github.event.inputs.mode }}"
          C="--days ${{ github.event.inputs.days }} --side ${{ github.event.inputs.side }} --max-conf-cost ${{ github.event.inputs.max_conf_cost }} --min-rr ${{ github.event.inputs.min_rr }} --oos"
          T="--tf ${{ github.event.inputs.tf }} --save-json results/range_${{ github.event.inputs.tf }}_$M.json"
          case "$M" in
            top100_multi_tf) python backtest_range.py --top 100 --tfs "${{ github.event.inputs.tfs }}" $C ;;
            top100) python backtest_range.py --top 100 $C $T ;;
            top50)  python backtest_range.py --top 50  $C $T ;;
            top30)  python backtest_range.py --top 30  $C $T ;;
            liste)  python backtest_range.py --symbols "${{ github.event.inputs.symbols }}" $C $T ;;
            *)      python backtest_range.py --symbol "${{ github.event.inputs.symbol }}" $C $T ;;
          esac

      - name: Sonuclari repoya kaydet
        continue-on-error: true
        run: |
          git config user.name "allo-screener-bot"
          git config user.email "actions@github.com"
          git add results/*.json
          git diff --quiet --cached || git commit -m "range backtest sonuc [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: range-results
          path: results/*.json
