name: Allo Screener

on:
  schedule:
    - cron: "*/30 * * * *"   # her 30 dakikada bir
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari yukle
        run: pip install -r requirements.txt

      - name: Screener'i calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_SIGNALS: ${{ secrets.TOPIC_SIGNALS }}
          TOPIC_RESULTS: ${{ secrets.TOPIC_RESULTS }}
          TOPIC_SUMMARY: ${{ secrets.TOPIC_SUMMARY }}
          TESTNET_API_KEY: ${{ secrets.TESTNET_API_KEY }}
          TESTNET_API_SECRET: ${{ secrets.TESTNET_API_SECRET }}
          TESTNET_RISK_USDT: "50"
          TESTNET_LEVERAGE: "5"
          # 2026-09-13 KULLANICI KARARI: demo hesapta sadece trend islem yapar. ICT arka planda
          # hesaplanir (positions.json), testnete yeni emir ve anlik Telegram mesaji gondermez.
          # Mevcut acik ICT testnet islemleri kapanana kadar eslenmeye devam eder.
          ICT_TESTNET: "0"
          ICT_TELEGRAM: "0"
        run: python screener.py

      - name: State dosyasini geri commit'le
        continue-on-error: true
        run: |
          git config user.name "allo-screener-bot"
          git config user.email "actions@github.com"
          date -u +"son calisma: %Y-%m-%d" > last_run.txt
          git add positions.json testnet_orders.json last_run.txt ozet_state.json 2>/dev/null || git add positions.json testnet_orders.json last_run.txt
          git diff --quiet --cached || git commit -m "state guncelle [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Push basarili."
              exit 0
            fi
            echo "Push denemesi $i basarisiz, tekrar deneniyor..."
            sleep 5
          done
          echo "Push yapilamadi (tarama yine de calisti)."
