name: Testnet Test

on:
  workflow_dispatch:
    inputs:
      sembol:
        description: "Coin"
        default: "BTCUSDT"
      yon:
        description: "Yon"
        type: choice
        options: ["LONG", "SHORT"]
        default: "LONG"
      mod:
        description: "durum=rapor | market=hemen ac | limit=beklesin"
        type: choice
        options: ["durum", "market", "limit"]
        default: "durum"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Testnet deneme
        env:
          TESTNET_API_KEY: ${{ secrets.TESTNET_API_KEY }}
          TESTNET_API_SECRET: ${{ secrets.TESTNET_API_SECRET }}
          TESTNET_RISK_USDT: "50"
          TESTNET_LEVERAGE: "5"
          SEMBOL: ${{ github.event.inputs.sembol }}
          YON: ${{ github.event.inputs.yon }}
          MOD: ${{ github.event.inputs.mod }}
        run: python testnet_deneme.py
