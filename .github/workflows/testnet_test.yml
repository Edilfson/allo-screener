name: Testnet Test

on:
  workflow_dispatch:
    inputs:
      sembol:
        description: "Coin"
        default: "BTCUSDT"
      yon:
        description: "Yon"
        type: choice
        options: ["LONG", "SHORT"]
        default: "LONG"
      mod:
        description: "limit = beklesin | market = HEMEN acilsin"
        type: choice
        options: ["market", "limit"]
        default: "market"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Testnet deneme islemi
        env:
          TESTNET_API_KEY: ${{ secrets.TESTNET_API_KEY }}
          TESTNET_API_SECRET: ${{ secrets.TESTNET_API_SECRET }}
          TESTNET_RISK_USDT: "50"
          TESTNET_LEVERAGE: "5"
          SEMBOL: ${{ github.event.inputs.sembol }}
          YON: ${{ github.event.inputs.yon }}
          MOD: ${{ github.event.inputs.mod }}
        run: |
          python - <<'PY'
          import os, requests, testnet_trader as T
          sym=os.environ.get("SEMBOL","BTCUSDT"); yon=os.environ.get("YON","LONG")
          mod=os.environ.get("MOD","market"); side=1 if yon=="LONG" else -1
          print("="*58)
          b=T.bakiye()
          print("1) BAGLANTI:", "OK" if b is not None else "BASARISIZ")
          if b is None: raise SystemExit(1)
          print(f"   Bakiye: {b:,.2f} USDT")
          f=float(requests.get(f"{T.BASE}/fapi/v1/ticker/price",params={"symbol":sym},timeout=20).json()["price"])
          print(f"2) {sym} fiyat: {f}")
          tick,adim,qp,pp=T.sembol_bilgi(sym)
          if mod=="market":
              stop=T._yuvarla(f*(0.98 if side==1 else 1.02),tick,pp)
              tp=T._yuvarla(f+side*5*abs(f-stop),tick,pp)
              mik=T._yuvarla(T.RISK_USDT/abs(f-stop),adim,qp)
              print(f"3) PIYASA EMRI: {yon} miktar={mik} stop={stop} tp={tp}")
              T._imzali("/fapi/v1/leverage",{"symbol":sym,"leverage":T.LEVERAGE},"POST")
              ok,c=T._imzali("/fapi/v1/order",{"symbol":sym,"side":"BUY" if side==1 else "SELL",
                    "type":"MARKET","quantity":mik},"POST")
              print("   giris emri:", "ACILDI" if ok else "HATA", c)
              if ok:
                  ters="SELL" if side==1 else "BUY"
                  ok2,c2=T._imzali("/fapi/v1/order",{"symbol":sym,"side":ters,
                        "type":"STOP_MARKET","stopPrice":stop,"closePosition":"true"},"POST")
                  print("   stop emri:", "OK" if ok2 else "HATA", c2 if not ok2 else "")
                  ok3,c3=T._imzali("/fapi/v1/order",{"symbol":sym,"side":ters,
                        "type":"TAKE_PROFIT_MARKET","stopPrice":tp,"closePosition":"true"},"POST")
                  print("   tp emri:", "OK" if ok3 else "HATA", c3 if not ok3 else "")
          else:
              giris=f*(0.97 if side==1 else 1.03); stop=giris*(0.98 if side==1 else 1.02)
              tp=giris+side*5*abs(giris-stop)
              plan={"side":side,"entry":giris,"stop":stop,"tps":[{"p":tp,"w":1.0,"r":5.0,"hit":False}]}
              ok,c=T.emir_ac(plan,sym); print("3) LIMIT EMIR:", "ACILDI" if ok else "HATA", c)
          print("4) POZISYON DURUMU:")
          import time as _t; _t.sleep(3)
          p=T.pozisyon_var_mi(sym)
          print("   ", p if p else "acik pozisyon yok (limit emir bekliyor olabilir)")
          ae=T.acik_emirler(sym)
          print(f"5) BEKLEYEN EMIRLER ({len(ae)}):")
          for e in ae: print(f"   {e.get('type')} {e.get('side')} @ {e.get('stopPrice') or e.get('price')}")
          print("="*58)
          PY
