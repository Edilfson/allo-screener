name: Komut Botu

on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada bir komutlari kontrol et
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: komut-botu
  cancel-in-progress: false

jobs:
  komutlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bagimliliklar
        run: pip install -r requirements.txt

      - name: Komutlari isle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python komut_botu.py

      - name: Bot state kaydet
        continue-on-error: true
        run: |
          git config user.name "allo-screener-bot"
          git config user.email "actions@github.com"
          git add bot_state.json
          git diff --quiet --cached || git commit -m "bot state [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
