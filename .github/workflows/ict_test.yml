name: ICT Testi

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Hangi coinler"
        type: choice
        options: ["btc_eth", "ilk10", "ilk30", "ilk100", "ozel"]
        default: "ilk10"
      symbols:
        description: "hedef=ozel ise"
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      tf:
        description: "Zaman dilimi"
        type: choice
        options: ["1h", "2h", "4h", "1d"]
        default: "1h"
      days:
        description: "Kac gunluk gecmis"
        default: "1460"

permissions:
  contents: write

jobs:
  ict:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install requests pandas numpy
      - name: ICT testi
        run: |
          H="${{ github.event.inputs.hedef }}"
          C="--tf ${{ github.event.inputs.tf }} --days ${{ github.event.inputs.days }} --save-json results/ict_${{ github.event.inputs.tf }}_$H.json"
          case "$H" in
            btc_eth) python ict_test.py --symbols "BTCUSDT,ETHUSDT" $C ;;
            ilk10)   python ict_test.py --top 10  $C ;;
            ilk30)   python ict_test.py --top 30  $C ;;
            ilk100)  python ict_test.py --top 100 $C ;;
            *)       python ict_test.py --symbols "${{ github.event.inputs.symbols }}" $C ;;
          esac
      - name: Sonucu kaydet
        continue-on-error: true
        run: |
          git config user.name "allo-screener-bot"
          git config user.email "actions@github.com"
          git add results/ict_*.json
          git diff --quiet --cached || git commit -m "ict sonuc [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ict-results
          path: results/ict_*.json
