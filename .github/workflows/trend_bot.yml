name: Trend Bot

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install requests pandas numpy matplotlib
      - name: Trend sinyali
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_SIGNALS: ${{ secrets.TOPIC_SIGNALS }}
        run: python trend_bot.py
      - name: Durumu kaydet
        continue-on-error: true
        run: |
          git config user.name "allo-screener-bot"
          git config user.email "actions@github.com"
          git add trend_state.json
          git diff --quiet --cached || git commit -m "trend durum [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
