name: Trend Takibi

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install requests pandas numpy matplotlib
      - name: Trend sinyali
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_SIGNALS: ${{ secrets.TOPIC_SIGNALS }}
          # 9 yillik backtest (araclar/btc_uzun.py): MA50 bu ucunde IS+OOS al-tutu geciyor
          TREND_SYMBOL: "BTCUSDT,ETHUSDT,BNBUSDT"
          TREND_MA: "50"
          # TESTNET ESLEME: b3 sepeti hedef agirliklari 1x kaldiracla testnete yansitilir
          # (kagit takip aynen devam eder; anahtar yoksa otomatik kuru mod)
          TESTNET_API_KEY: ${{ secrets.TESTNET_API_KEY }}
          TESTNET_API_SECRET: ${{ secrets.TESTNET_API_SECRET }}
          TREND_TESTNET: "1"
          TREND_TESTNET_USDT: "1000"
        run: python trend_bot.py
      - name: Durumu kaydet
        continue-on-error: true
        run: |
          git config user.name "allo-screener-bot"
          git config user.email "actions@github.com"
          git add trend_state.json
          git add testnet_orders.json || true    # testnet kapali/dosya yoksa sorun degil
          git diff --quiet --cached || git commit -m "trend durum [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
